<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Office Supplies and Equipment | European Parliament</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #f5f7fa;
      color: #1f2a37;
      margin: 0;
    }

    body>aside,
    body>main,
    body>section {
      padding: 0 20px;
    }

    input,
    select,
    textarea {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      font-size: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1A3C8D;
      color: white;
      padding: 1.5rem 4.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-weight: 700;
      font-size: 1.2em;
    }

    .brand img {
      width: 270px;
      height: 73px;
    }

    nav[aria-label="Order"] .cart-btn {
      background: white;
      color: #1A3C8D;
      border: none;
      border-radius: 999px;
      padding: .25rem .75rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .cart-count {
      background: #FFD700;
      border-radius: 999px;
      padding: 0 .4rem;
      font-weight: 700;
      margin-left: -0.3rem;
    }

    main {
      max-width: 1000px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    ul.products {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    ul.products li {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .product-list {
      margin: 0;
    }

    .stock-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0;
      font-size: 0.9em;
    }

    .stock-dot {
      width: 10px;
      height: 10px;
      background: #0EB551;
      background: radial-gradient(circle, rgba(13, 171, 77, 1) 34%, rgba(10, 136, 60, 1) 93%);
      ;
      border-radius: 50%;
      display: inline-block;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: .25rem;
      margin-top: auto;
    }

    .qty {
      width: 3rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.5rem .2rem;
    }

    .qty:focus {
      outline: 2px solid #1A3C8D;
      outline-offset: 2px;
    }

    .btn {
      background: #1A3C8D;
      color: white;
      border: none;
      border-radius: 6px;
      padding: .4rem .6rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:focus {
      outline: 2px solid #1A3C8D;
      outline-offset: 2px;
    }

    .btn.secondary {
      background: white;
      color: #1A3C8D;
      border: 1px solid #444;
      font-size: 16px;
    }

    .btn.secondary:focus {
      outline: 2px solid #1A3C8D;
      outline-offset: 2px;
    }

    .btn.add {
      white-space: nowrap;
      line-height: 1.2;
      text-align: center;
      padding: .75rem 1.25rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn.add:hover {
      background: #003d7a;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 85, 164, 0.3);
    }

    .btn.add:focus {
      outline: 2px solid #1A3C8D;
      outline-offset: 2px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .25);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .backdrop.open {
      display: flex;
    }

    .dialog {
      background: white;
      border-radius: 8px;
      width: min(700px, 95%);
      max-height: 80vh;
      overflow: auto;
      padding: 1rem;
      position: relative;
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: .5rem;
      border-radius: 4px;
    }

    .close-btn:hover {
      background: #f0f0f0;
    }

    .close-btn:focus {
      outline: 2px solid #1A3C8D;
      outline-offset: 2px;
    }

    /* Screen reader only */
    .sr-only {
      position: absolute !important;
      left: -9999px;
      height: 1px;
      width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }

    .cart-list {
      list-style: none;
      padding: 0;
    }

    .cart-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding: .5rem 0;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: .25rem;
    }

    .dialog-actions {
      margin-top: 1rem;
      display: flex;
      gap: .5rem;
    }

    .accordion-trigger {
      width: fit-content;
      cursor: pointer;
      font-size: .9rem;
      font-weight: bold;
      margin: 1rem 0;
    }

    .accordion-trigger~.panel {
      font-size: .9rem;
    }

    .accordion-trigger~.panel ul li {
      padding: 0;
      border: 0;
      border-radius: 0;
      display: list-item !important;
      list-style-type: square !important;
    }

    /* NO SPINNER IN QUANTITY FIELD */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    /* END - NO SPINNER IN QUANTITY FIELD */

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: #ffffff;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .header-logo {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 1rem;
      }

      .brand {
        gap: 1rem;
      }

      .brand-title {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
      }

      .brand {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .brand-title {
        font-size: 1rem;
      }
    }

    /* END - HEADER */
  </style>
</head>

<body>
  <header class="header">
    <div class="brand">
      <img src="ep_logo_itec.png"
        alt="Logo of the European Parliament with text Directorate-General for Information Technologies and Cybersecurity"
        width="270" height="73" class="header-logo">
      <span class="brand-title">Logistic Supplies Portal</span>
    </div>
    <nav aria-label="Order">
      <button id="cartBtn" class="cart-btn" aria-haspopup="dialog" aria-controls="cartDialog"
        aria-label="Preview order: 0 items">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M17 17h-11v-14h-2" />
          <path d="M6 5l14 1l-1 7h-13" />
        </svg>
        <span id="cartCount" class="cart-count">0</span>
      </button>
    </nav>
  </header>

  <main>
    <div id="globalStatus" class="sr-only" role="status" aria-live="polite"></div>
    <h1>Available office supplies and equipment </h1>
    <ul id="productList" class="products"></ul>
  </main>

  <div id="backdrop" class="backdrop">
    <div id="cartDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="cartDialogTitle">
      <button id="closeBtn" class="close-btn" aria-label="Close order preview">&times;</button>
      <div class="dialog-header">
        <h2 id="cartDialogTitle">Preview order</h2>
      </div>
      <div id="cartContent"></div>
      <div id="dialogAlerts" class="sr-only" role="alert"></div>
    </div>
  </div>

  <script>
    const products = [
      { id: 'monitor', name: 'Ergonomic monitor', desc: '27 inches IPS display', quantity: 'in stock', spec1: 'Panel Technology: IPS (In-Plane Switching)', spec2: 'Stand: Fully adjustable (Height, tilt, swivel, pivot)', spec3: 'Eye Care Technology: Flicker-free and low blue light for long work sessions', spec4: 'VESA Mount: Compatible (100 × 100 mm)' },
      { id: 'desk', name: 'Adjustable desk', desc: 'Electrically height-adjustable, 140×70 cm, (light grey)', quantity: 'in stock', spec1: 'Height Range: 65 cm to 125 cm', spec2: 'Frame Material: steel', spec3: 'Power Input: 100V - 240V', spec4: 'Max Load Capacity: 80 kg' },
      { id: 'chair', name: 'Ergonomic chair', desc: 'Certified ergonomic, synchronous mechanism, lumbar support', quantity: 'in stock', spec1: 'Mechanism: Synchronous tilt', spec2: 'Support: Integrated lumbar support', spec3: 'Adjustability: Multi-functional adjustments', spec4: 'Certification: BIFMA / Ergonomic Certified' },
      { id: 'lamp', name: 'Desk lamp', desc: 'Energy-efficient LED, adjustable arm, certified', quantity: 'in stock', spec1: 'Touch-sensitive control', spec2: 'Dimmable brightness levels', spec3: 'Flicker-free technology', spec4: 'USB charging port Integrated' },
      { id: 'pens', name: 'Pens', desc: 'Box of 10, standard blue ink', quantity: 'in stock', spec1: 'Smudge-proof ink', spec2: '0.7mm medium point', spec3: 'Ergonomic rubber grip', spec4: 'Retractable click mechanism' },
      { id: 'blocknote', name: 'Notepad', desc: 'A5 format, 120 pages, square ruled, recycled paper', quantity: 'in stock', spec1: '80 GSM premium paper thickness', spec2: 'Acid-free paper for long-term archiving', spec3: 'Lay-flat binding mechanism', spec4: 'Perforated pages for easy tearing' }
    ];
    const cart = new Map();
    const productList = document.getElementById('productList');
    const cartBtn = document.getElementById('cartBtn');
    const cartCount = document.getElementById('cartCount');
    const backdrop = document.getElementById('backdrop');
    const cartDialog = document.getElementById('cartDialog');
    const cartContent = document.getElementById('cartContent');
    const globalStatus = document.getElementById('globalStatus');
    const dialogAlerts = document.getElementById('dialogAlerts');
    const closeBtn = document.getElementById('closeBtn');

    let focusableElements = [];
    let firstFocusableElement;
    let lastFocusableElement;

    function updateCartCount() {
      let total = [...cart.values()].reduce((a, b) => a + b, 0);
      cartCount.textContent = total;
      cartBtn.setAttribute('aria-label', `Preview order: ${total} item${total !== 1 ? 's' : ''}`);
    }

    async function polite(msg) {
      globalStatus.textContent = msg;
      await new Promise(resolve => setTimeout(resolve, 1000));
      globalStatus.textContent = "";
    }

    async function assertive(msg) {
      dialogAlerts.textContent = msg;
      await new Promise(resolve => setTimeout(resolve, 1000));
      dialogAlerts.textContent = "";
    }

    function renderProducts() {
      productList.innerHTML = '';
      products.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<h2>${p.name}</h2>
    <p id="desc-${p.id}" class="product-list">${p.desc}</p>
    <span id="spec-desc-${p.id}" class="sr-only">Read more spec for ${p.name}</span>
    <details aria-labelledby="spec-desc-${p.id}">
      <summary class="accordion-trigger">Read More Specs</summary>
      <div class="panel">
        <ul>
          <li>${p.spec1}</li>
          <li>${p.spec2}</li>
          <li>${p.spec3}</li>
          <li>${p.spec4}</li>
        </ul>
      </div>
    </details>
    <p id="quantity-${p.id}" class="stock-indicator"><span class="stock-dot" aria-hidden="true"></span>
      ${p.quantity}</p>`;
        const controls = document.createElement('div');
        controls.className = 'controls';

        const decBtn = document.createElement('button');
        decBtn.className = 'btn secondary';
        decBtn.textContent = '-';
        decBtn.setAttribute('aria-label', `Decrease ${p.name} quantity`);

        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '0';
        qtyInput.value = '0';
        qtyInput.className = 'qty';
        qtyInput.id = `qty-${p.id}`;
        qtyInput.setAttribute('aria-label', `Quantity for ${p.name}`);

        const incBtn = document.createElement('button');
        incBtn.className = 'btn secondary';
        incBtn.textContent = '+';
        incBtn.setAttribute('aria-label', `Increase ${p.name} quantity`);

        const addBtn = document.createElement('button');
        addBtn.className = 'btn add';
        addBtn.textContent = 'Add to order';
        addBtn.setAttribute('aria-label', `Add ${p.name} to order`);

        controls.append(decBtn, qtyInput, incBtn, addBtn);
        li.appendChild(controls);
        productList.appendChild(li);

        decBtn.onclick = () => {
          let currentValue = parseInt(qtyInput.value || 0);
          let newValue = Math.max(0, currentValue - 1);
          qtyInput.value = newValue;
          polite(`${p.name} quantity decreased to ${newValue}`);
        };

        incBtn.onclick = () => {
          let currentValue = parseInt(qtyInput.value || 0);
          let newValue = currentValue + 1;
          qtyInput.value = newValue;
          polite(`${p.name} quantity increased to ${newValue}`);
        };

        addBtn.onclick = () => {
          let qty = parseInt(qtyInput.value || 0);
          if (qty > 0) {
            cart.set(p.id, (cart.get(p.id) || 0) + qty);
            updateCartCount();
            let totalItems = [...cart.values()].reduce((a, b) => a + b, 0);
            polite(`${qty} ${p.name}${qty > 1 ? 's' : ''} added to order. Order has ${totalItems} item${totalItems !== 1 ? 's' : ''}.`);
            qtyInput.value = 0;
          }
        };
      });
    }

    function getFocusableElements() {
      focusableElements = cartDialog.querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      );
      firstFocusableElement = focusableElements[0];
      lastFocusableElement = focusableElements[focusableElements.length - 1];
    }

    function trapFocus(e) {
      if (e.key === 'Tab') {
        if (e.shiftKey) {
          if (document.activeElement === firstFocusableElement) {
            lastFocusableElement.focus();
            e.preventDefault();
          }
        } else {
          if (document.activeElement === lastFocusableElement) {
            firstFocusableElement.focus();
            e.preventDefault();
          }
        }
      }

      if (e.key === 'Escape') {
        closeDialog();
      }
    }

    function openDialog() {
      backdrop.classList.add('open');
      renderCart();
      getFocusableElements();
      if (firstFocusableElement) {
        firstFocusableElement.focus();
      }
      document.addEventListener('keydown', trapFocus);
    }

    function closeDialog() {
      backdrop.classList.remove('open');
      document.removeEventListener('keydown', trapFocus);

      // Remove items with 0 quantity when closing
      for (let [id, qty] of cart.entries()) {
        if (qty === 0) {
          cart.delete(id);
        }
      }
      updateCartCount();

      cartBtn.focus();

    }

    function renderCart() {
      let total = [...cart.values()].reduce((a, b) => a + b, 0);
      document.getElementById("closeBtn").setAttribute("aria-label", "Close order preview");
      document.getElementById("cartDialogTitle").innerHTML = "Preview order";
      if (total === 0) {
        cartContent.innerHTML = '<p>Your order is empty.</p>';
        return;
      }

      let html = '<ul class="cart-list">';
      let itemIndex = 0;
      products.forEach(p => {
        let q = cart.get(p.id);
        if (q !== undefined) {
          html += `<li data-item-index="${itemIndex}">
        <span>${p.name}</span>
        <div class="cart-item-controls">
          <button class="btn secondary" aria-label="Decrease ${p.name} quantity" onclick="let el = document.getElementById('cart-qty-${p.id}'); if (el.value > 0) el.value -= 1; setItem('${p.id}', document.getElementById('cart-qty-${p.id}').value)">-</button>
          <input type="number" id="cart-qty-${p.id}" class="qty no-spinners" value="${q}" min="0" aria-label="Quantity for ${p.name}" onchange="setItem('${p.id}', this.value)">
          <button class="btn secondary" aria-label="Increase ${p.name} quantity" onclick="document.getElementById('cart-qty-${p.id}').value=Number(document.getElementById('cart-qty-${p.id}').value)+1; setItem('${p.id}', document.getElementById('cart-qty-${p.id}').value)">+</button>
        </div>
      </li>`;
          itemIndex++;
        }
      });
      html += '</ul><div class="dialog-actions"><button id="orderBtn" class="btn">Submit order request</button> <button id="emptyCartBtn" class="btn secondary">Empty order</button></div>';
      cartContent.innerHTML = html;
      document.getElementById('emptyCartBtn').onclick = emptyCart;
      document.getElementById('orderBtn').onclick = placeOrder;
    }

    function setItem(id, value) {
      let newQty = Math.max(0, parseInt(value) || 0);
      let productName = products.find(p => p.id === id).name;

      cart.set(id, newQty);
      assertive(`${productName} quantity set to ${newQty}.`);

      updateCartCount();
    }

    function removeItem(id, currentItemIndex) {
      let productName = products.find(p => p.id === id).name;
      cart.delete(id);
      updateCartCount();
      assertive(`${productName} removed from order.`);

      renderCart();
      getFocusableElements();

      // Focus on the next interactive element in order
      let nextItemLi = cartContent.querySelector(`[data-item-index="${currentItemIndex}"]`);
      if (nextItemLi) {
        // Focus on the first button of the next item (decrease button)
        let nextButton = nextItemLi.querySelector('.btn.secondary');
        if (nextButton) {
          nextButton.focus();
          return;
        }
      }

      // If no next item, focus on the first available interactive element
      if (firstFocusableElement) {
        firstFocusableElement.focus();
      }
    }

    function emptyCart() {
      cart.clear();
      updateCartCount();
      assertive('Order is empty.');
      renderCart();
      getFocusableElements();

      // After emptying cart, focus on the first available element
      if (firstFocusableElement) {
        firstFocusableElement.focus();
      }
    }

    function placeOrder() {
      let items = products.map(p => ({ name: p.name, qty: cart.get(p.id) || 0 })).filter(x => x.qty > 0);
      let orderNumber = 'EP-' + Math.floor(100000 + Math.random() * 900000);
      let itemsList = items.map(x => `<li>${x.name}: ${x.qty}</li>`).join('');

      document.getElementById("closeBtn").setAttribute("aria-label", "Close order confirmation");
      document.getElementById("cartDialogTitle").innerHTML = "Order confirmation";
      cartContent.innerHTML = `
    <div tabindex="-1" aria-live="polite">
      <p>Your order number ${orderNumber} was successful.</p>
      <p>Here is the resume of the items:</p>
      <ul>${itemsList}</ul>
      <p>You will soon hear from Service Desk.</p>
    </div>
  `;
      cart.clear();
      updateCartCount();
      const successDiv = cartContent.querySelector('div');
      successDiv.focus();
      getFocusableElements();
    }

    // Initialize
    renderProducts();
    cartBtn.onclick = openDialog;
    closeBtn.onclick = closeDialog;

    // Close dialog when clicking backdrop
    backdrop.onclick = (e) => {
      if (e.target === backdrop) {
        closeDialog();
      }
    };
  </script>
</body>

</html>
